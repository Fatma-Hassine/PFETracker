spring:
  application:
    name: pfetracker-module1

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/pfetracker
    username: ${DB_USERNAME:pfetracker}
    password: ${DB_PASSWORD:pfetracker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
        generate_statistics: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    tls: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:pfetracker-secret-key-module1-very-long-secret-key-256-bits-minimum}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  jwt:
    secret: MaCleSecreteTresLonguePourJwtPfetrackerModule1AvecAuMoins32Caracteres
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    expiration: 86400000

  cors:
    allowed-origins: http://localhost:4200,https://pfetracker.app

  email:
    domaine-autorise: "@institution.edu"

  security:
    max-tentatives-connexion: 5
    duree-verrouillage-minutes: 30
    duree-reset-token-heures: 1
    bcrypt-strength: 12

  audit:
    conservation-mois: 6

websocket:
  endpoint: /ws
  allowed-origins: "*"

logging:
  level:
    com.pfetracker: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"