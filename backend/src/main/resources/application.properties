# Application
spring.application.name=PFETracker
server.port=8081

# Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pfetracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Tunis

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pfetracker@univ.tn
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# JWT
jwt.secret=pfetracker-super-secret-key-change-in-production-2024
jwt.expiration=900000
jwt.refresh-expiration=604800000

# WebSocket
websocket.endpoint=/ws
websocket.allowed-origins=*

# Upload fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.pfetracker=INFO
logging.level.org.springframework.web.socket=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Pagination
pagination.default-size=20
pagination.max-size=100