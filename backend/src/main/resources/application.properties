# ===============================
# CORS
# MODIFIE : supprime les __ autour des cles
# ===============================
app.cors.allowed-origins[0]=http://localhost:5173
app.cors.allowed-origins[1]=http://localhost:3000
app.cors.allowed-origins[2]=http://localhost:4200
app.cors.allowed-origins[3]=https://pfetracker.app

# ===============================
# APP CONFIG
# MODIFIE : supprime les __ autour des cles et les liens http corrompus
# ===============================
app.email.domaine-autorise=@enicar.ucar.tn
app.security.max-tentatives-connexion=5
app.security.duree-verrouillage-minutes=30
app.security.duree-reset-token-heures=1
app.security.bcrypt-strength=12
app.audit.conservation-mois=6

# ===============================
# WEBSOCKET
# MODIFIE : supprime les __ autour des cles
# ===============================
websocket.endpoint=/ws
websocket.allowed-origins=*

# Upload fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.pfetracker=INFO
logging.level.org.springframework.web.socket=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Pagination
pagination.default-size=20
pagination.max-size=100
spring.jpa.open-in-view=false
spring.profiles.active=dev          
spring.sql.init.data-locations=classpath:init.sql        
spring.jpa.defer-datasource-initialization=true

# Gemini IA
gemini.enabled=true
gemini.api.key=AIzaSyBp0FWx5Dj9s0O5KizddvLdxhw3tO4jMBc
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.timeout-ms=30000

# Import automatique du fichier Excel PFE au démarrage
pfe.import.auto-enabled=true
pfe.import.file=data/affectations_pfe.xlsx

# Seuil de stagnation étudiant (cahier des charges §5.7.1)
pfe.stagnation.seuil-jours=7

# ===============================
# GOOGLE CALENDAR / GOOGLE MEET (§6.3.1)
# À renseigner avec les identifiants OAuth2 "Web application" créés dans
# Google Cloud Console (API Google Calendar activée, écran de consentement
# configuré). Tant que ces valeurs sont vides, la génération de lien Google
# Meet retombe automatiquement sur un lien de secours (§6.3.1 - option
# alternative Zoom/Teams / lien fictif).
# ===============================
google.oauth.client-id=
google.oauth.client-secret=
google.oauth.redirect-uri=http://localhost:8083/api/v3/public/google/callback


# Logging dans un fichier externe à la racine du projet
logging.file.name=../logs/pfetracker.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

