# Application
spring.application.name=PFETracker
server.port=8081
# server.servlet.context-path=/api

# Database SQLite
spring.datasource.url=jdbc:sqlite:pfetracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.id.optimizer.pooled.prefer_lo=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Tunis

# Email
spring.mail.host=mail.enicar.ucar.tn
spring.mail.port=587
spring.mail.username=warda.guesmi@enicar.ucar.tn
spring.mail.password=2003aaa
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=mail.enicar.ucar.tn

# JWT
jwt.secret=pfetracker-module3-super-secret-key-change-in-production-2024-must-be-64-chars-min!!
jwt.expiration=900000
jwt.refresh-expiration=604800000

# WebSocket
websocket.endpoint=/ws
websocket.allowed-origins=*

# Upload fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.pfetracker=INFO
logging.level.org.springframework.web.socket=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Pagination
pagination.default-size=20
pagination.max-size=100
spring.jpa.open-in-view=false
spring.profiles.active=dev          
spring.sql.init.data-locations=classpath:init.sql
spring.sql.init.mode=always         
spring.jpa.defer-datasource-initialization=true

# Gemini IA
gemini.enabled=true
gemini.api.key=AIzaSyBp0FWx5Dj9s0O5KizddvLdxhw3tO4jMBc
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.timeout-ms=30000

# Import automatique du fichier Excel PFE au démarrage
pfe.import.auto-enabled=true
pfe.import.file=data/affectations_pfe.xlsx
